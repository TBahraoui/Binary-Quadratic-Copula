<svg xmlns="http://www.w3.org/2000/svg" width="850" height="670" viewBox="0 0 850 670" role="img" aria-labelledby="title desc">
  <title id="title">Schematic heatmap of a binary quadratic copula interaction matrix</title>
  <desc id="desc">A nine-variable symmetric interaction matrix. Positive interactions are shown in red, zero interactions in off-white, and the diagonal is zero. Three groups of variables have positive within-group interactions.</desc>
  <rect width="850" height="670" fill="#fff"/>
  <text x="425" y="42" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#253244">Binary quadratic copula: interaction heatmap</text>
  <text x="425" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5b6777">Schematic Ω matrix · symmetric pairwise interaction strengths</text>
  <text x="257" y="118" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#3e4b59">Variable</text>
  <text x="85" y="365" text-anchor="middle" transform="rotate(-90 85 365)" font-family="sans-serif" font-size="15" font-weight="600" fill="#3e4b59">Variable</text>
  <g font-family="sans-serif" font-size="12" fill="#465466" text-anchor="middle">
    <text x="140" y="152">X1</text><text x="177" y="152">X2</text><text x="214" y="152">X3</text><text x="251" y="152">X4</text><text x="288" y="152">X5</text><text x="325" y="152">X6</text><text x="362" y="152">X7</text><text x="399" y="152">X8</text><text x="436" y="152">X9</text>
    <text x="112" y="185">X1</text><text x="112" y="222">X2</text><text x="112" y="259">X3</text><text x="112" y="296">X4</text><text x="112" y="333">X5</text><text x="112" y="370">X6</text><text x="112" y="407">X7</text><text x="112" y="444">X8</text><text x="112" y="481">X9</text>
  </g>
