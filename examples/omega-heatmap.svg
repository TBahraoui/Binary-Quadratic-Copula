  <text x="515" y="181" font-family="sans-serif" font-size="15" font-weight="700" fill="#334155">Interaction Ωᵢⱼ</text>
  <rect x="520" y="208" width="35" height="230" fill="url(#scale)" stroke="#d5dce5"/>
  <defs><linearGradient id="scale" x1="0" x2="0" y1="1" y2="0"><stop offset="0" stop-color="#f7f7f7"/><stop offset="1" stop-color="#b2182b"/></linearGradient></defs>
  <text x="568" y="219" font-family="sans-serif" font-size="13" fill="#596879">positive</text>
  <text x="568" y="443" font-family="sans-serif" font-size="13" fill="#596879">zero</text>
  <rect x="515" y="493" width="275" height="75" rx="12" fill="#f5f7fa"/>
  <text x="535" y="521" font-family="sans-serif" font-size="14" font-weight="700" fill="#334155">Reading the heatmap</text>
  <text x="535" y="545" font-family="sans-serif" font-size="13" fill="#596879">Color intensity shows interaction magnitude;</text>
  <text x="535" y="563" font-family="sans-serif" font-size="13" fill="#596879">the matrix is symmetric with zero diagonal.</text>
  <text x="425" y="617" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#788493">Schematic example only. Run examples/omega_heatmap.R to plot simulated and estimated Ω.</text>
