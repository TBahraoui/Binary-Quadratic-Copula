<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">Reported binary quadratic copula application results</title>
  <desc id="desc">Two-panel summary of the user-provided Arabidopsis isoprenoid pathway and human bone marrow single-cell RNA sequencing results, including sample dimensions, selected interaction estimates, validation percentages, and model performance.</desc>
  <rect width="1200" height="940" fill="#f7f9fc"/>
  <text x="600" y="48" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#182433">Binary quadratic copula: application results</text>
  <text x="600" y="78" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5b6777">Summary of the figures supplied in the manuscript excerpt</text>

  <!-- Arabidopsis panel -->
  <rect x="40" y="110" width="550" height="770" rx="18" fill="#ffffff" stroke="#d9e1eb" stroke-width="2"/>
  <rect x="40" y="110" width="550" height="68" rx="18" fill="#e9f4ec"/>
  <path d="M40 160h550v18H40z" fill="#e9f4ec"/>
  <text x="66" y="153" font-family="sans-serif" font-size="23" font-weight="700" fill="#24583a">Arabidopsis thaliana</text>
  <text x="66" y="204" font-family="sans-serif" font-size="16" fill="#526071">Isoprenoid pathway · 118 microarrays · 39 genes</text>

  <text x="66" y="250" font-family="sans-serif" font-size="15" font-weight="700" fill="#334155">Estimated interaction structure</text>
  <rect x="66" y="267" width="145" height="78" rx="12" fill="#f0f5fa"/>
  <text x="138" y="299" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#24476b">87</text>
  <text x="138" y="325" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#596879">significant interactions</text>
  <rect x="226" y="267" width="145" height="78" rx="12" fill="#f0f5fa"/>
  <text x="298" y="299" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#24476b">11.7%</text>
  <text x="298" y="325" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#596879">reported sparsity</text>
  <rect x="386" y="267" width="174" height="78" rx="12" fill="#f0f5fa"/>
  <text x="473" y="299" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#24476b">73.2%</text>
  <text x="473" y="325" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#596879">spectral mass in 5 eigenvalues</text>

  <text x="66" y="384" font-family="sans-serif" font-size="15" font-weight="700" fill="#334155">Highlighted reported interaction</text>
  <rect x="66" y="400" width="494" height="83" rx="12" fill="#fbf8ef" stroke="#eadcae"/>
  <circle cx="123" cy="441" r="24" fill="#4c78a8"/><circle cx="285" cy="441" r="24" fill="#4c78a8"/>
  <line x1="147" y1="441" x2="261" y2="441" stroke="#31945a" stroke-width="5"/>
  <text x="123" y="446" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff">HMGR</text>
  <text x="285" y="446" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff">DXS</text>
  <text x="342" y="433" font-family="sans-serif" font-size="15" font-weight="700" fill="#3e4b59">Ω̂ = 0.42 · p &lt; 0.01</text>
  <text x="342" y="456" font-family="sans-serif" font-size="13" fill="#596879">Gaussian copula: ρ̂ = 0.18 · p = 0.24</text>

  <text x="66" y="525" font-family="sans-serif" font-size="15" font-weight="700" fill="#334155">STRING validation</text>
  <text x="66" y="551" font-family="sans-serif" font-size="13" fill="#596879">Reported percentage (comparison with Ising)</text>
  <text x="66" y="588" font-family="sans-serif" font-size="14" fill="#334155">Binary quadratic copula</text>
  <rect x="260" y="570" width="250" height="25" rx="5" fill="#edf1f5"/><rect x="260" y="570" width="208" height="25" rx="5" fill="#31945a"/>
  <text x="520" y="589" font-family="sans-serif" font-size="14" font-weight="700" fill="#24583a">66.7%</text>
  <text x="66" y="629" font-family="sans-serif" font-size="14" fill="#334155">Ising</text>
  <rect x="260" y="611" width="250" height="25" rx="5" fill="#edf1f5"/><rect x="260" y="611" width="98" height="25" rx="5" fill="#8da0b3"/>
  <text x="520" y="630" font-family="sans-serif" font-size="14" font-weight="700" fill="#596879">31.2%</text>
  <text x="66" y="665" font-family="sans-serif" font-size="12" fill="#697586">Reported comparison: p = 2.3 × 10⁻⁸</text>

  <line x1="66" y1="692" x2="560" y2="692" stroke="#e3e8ef"/>
  <text x="66" y="725" font-family="sans-serif" font-size="14" font-weight="700" fill="#334155">Additional reported results</text>
  <text x="66" y="753" font-family="sans-serif" font-size="13" fill="#526071">Independent stress-dataset replication: 59.8% (p &lt; 10⁻⁸)</text>
  <text x="66" y="779" font-family="sans-serif" font-size="13" fill="#526071">GO enrichment: chloroplast organization (p = 0.003)</text>
  <text x="66" y="803" font-family="sans-serif" font-size="13" fill="#526071">and response to abiotic stimulus (p = 0.007)</text>
  <text x="66" y="845" font-family="sans-serif" font-size="12" fill="#788493">Gaussian copula goodness-of-fit: bootstrap p̂ &lt; 10⁻⁴ (B = 10,000)</text>

  <!-- scRNA panel -->
  <rect x="610" y="110" width="550" height="770" rx="18" fill="#ffffff" stroke="#d9e1eb" stroke-width="2"/>
  <rect x="610" y="110" width="550" height="68" rx="18" fill="#edf1fa"/>
  <path d="M610 160h550v18H610z" fill="#edf1fa"/>
  <text x="636" y="153" font-family="sans-serif" font-size="23" font-weight="700" fill="#344b7a">Single-cell RNA sequencing</text>
  <text x="636" y="204" font-family="sans-serif" font-size="16" fill="#526071">Human Cell Atlas bone marrow · 8,234 cells · 500 HVGs</text>

  <text x="636" y="250" font-family="sans-serif" font-size="15" font-weight="700" fill="#334155">Top interactions vs. continuous analog</text>
  <rect x="636" y="267" width="498" height="88" rx="12" fill="#f0f5fa"/>
  <text x="667" y="305" font-family="sans-serif" font-size="27" font-weight="700" fill="#24476b">78 / 100</text>
  <text x="667" y="330" font-family="sans-serif" font-size="13" fill="#596879">top interactions shared · Jaccard = 0.64 (78/122)</text>
  <text x="1098" y="306" text-anchor="end" font-family="sans-serif" font-size="13" fill="#596879">hypergeometric</text>
  <text x="1098" y="330" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="700" fill="#344b7a">p &lt; 10⁻¹⁵</text>

  <text x="636" y="395" font-family="sans-serif" font-size="15" font-weight="700" fill="#334155">STRING validation</text>
  <text x="636" y="421" font-family="sans-serif" font-size="13" fill="#596879">Reported percentages; denominators differ</text>
  <text x="636" y="458" font-family="sans-serif" font-size="14" fill="#334155">WGCNA shared set (n = 211)</text>
  <rect x="855" y="440" width="220" height="25" rx="5" fill="#edf1f5"/><rect x="855" y="440" width="172" height="25" rx="5" fill="#596fb0"/>
  <text x="1087" y="459" font-family="sans-serif" font-size="14" font-weight="700" fill="#344b7a">78.2%</text>
  <text x="636" y="499" font-family="sans-serif" font-size="14" fill="#334155">CBMAT full set (n = 1,247)</text>
  <rect x="855" y="481" width="220" height="25" rx="5" fill="#edf1f5"/><rect x="855" y="481" width="147" height="25" rx="5" fill="#8da0b3"/>
  <text x="1087" y="500" font-family="sans-serif" font-size="14" font-weight="700" fill="#596879">66.9%</text>

  <text x="636" y="557" font-family="sans-serif" font-size="15" font-weight="700" fill="#334155">Highlighted reported interaction</text>
  <rect x="636" y="573" width="498" height="83" rx="12" fill="#f5f3fb" stroke="#ded7ef"/>
  <circle cx="694" cy="614" r="24" fill="#596fb0"/><circle cx="856" cy="614" r="24" fill="#596fb0"/>
  <line x1="718" y1="614" x2="832" y2="614" stroke="#596fb0" stroke-width="5"/>
  <text x="694" y="619" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff">GATA1</text>
  <text x="856" y="619" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff">KLF1</text>
  <text x="906" y="609" font-family="sans-serif" font-size="15" font-weight="700" fill="#3e4b59">Ω̂ = 0.67</text>
  <text x="906" y="633" font-family="sans-serif" font-size="13" fill="#596879">p &lt; 10⁻⁶</text>

  <text x="636" y="705" font-family="sans-serif" font-size="15" font-weight="700" fill="#334155">Predictive performance</text>
  <rect x="636" y="722" width="498" height="92" rx="12" fill="#f0f5fa"/>
  <text x="670" y="761" font-family="sans-serif" font-size="27" font-weight="700" fill="#24476b">AUC 0.812</text>
  <text x="670" y="788" font-family="sans-serif" font-size="13" fill="#596879">Test set</text>
  <line x1="850" y1="741" x2="850" y2="796" stroke="#d7dee8" stroke-width="2"/>
  <text x="880" y="761" font-family="sans-serif" font-size="25" font-weight="700" fill="#31945a">+2.4 pp</text>
  <text x="880" y="788" font-family="sans-serif" font-size="13" fill="#596879">vs. Gaussian copula</text>

  <text x="636" y="850" font-family="sans-serif" font-size="12" fill="#788493">All values are as reported in the supplied application excerpt.</text>

  <text x="600" y="918" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7b8794">Illustrative summary of reported statistics; not a reconstruction from raw expression data.</text>
</svg>
